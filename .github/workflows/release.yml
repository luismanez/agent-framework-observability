name: Release to NuGet.org

on:
  push:
    tags:
      - "v*"   # triggers on v0.1.0, v1.0.0-preview.1, etc.

permissions:
  contents: read
  id-token: write   # required for NuGet Trusted Publishing (OIDC)

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs full history to resolve the version from git tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack --no-build -c Release -o ./artifacts
        # Only packs projects with <IsPackable>true</IsPackable>:
        #   - Melic.AgentFramework.Observability.Abstractions
        #   - Melic.AgentFramework.Observability.Sessions
        # MinVer derives the version automatically from the git tag (e.g. v0.1.0 → 0.1.0)

      - name: NuGet login via Trusted Publishing (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # Your nuget.org profile name (NOT your email).
          # Store it as a repository secret: Settings → Secrets → NUGET_USERNAME
          user: ${{ secrets.NUGET_USERNAME }}
        # This step exchanges the GitHub OIDC token for a short-lived (~1h) NuGet API key.
        # No long-lived secret is stored anywhere.
        # Prerequisite: create a Trusted Publishing policy on nuget.org:
        #   nuget.org → (user menu) → Trusted Publishing → Add policy
        #     - Repository owner : luismanez
        #     - Repository       : agent-framework-observability
        #     - Workflow file    : release.yml

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
